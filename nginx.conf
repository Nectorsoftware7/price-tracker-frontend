server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # In docker-compose (local), "backend" resolves to the sibling container.
        # In standalone deployment (Render/Vercel), point this at the deployed
        # backend's public URL instead.
        proxy_pass https://price-tracker-backend-ioqo.onrender.com/api/;
        proxy_set_header Host price-tracker-backend-ioqo.onrender.com;
        proxy_ssl_server_name on;

        # A single "Check now" (Playwright-based scraping via ScraperAPI for some
        # sites) plus a cold-start wake-up on Render's free tier can comfortably
        # exceed nginx's 60s default, returning a 504 to the browser even though the
        # backend finishes the check moments later in the background. Since scrapes
        # are now serialized through a single in-process queue (to avoid OOM-crashing
        # the 512MB instance), a request can also sit queued behind another slow
        # check — 120s wasn't enough headroom for that stacked wait either.
        proxy_connect_timeout 280s;
        proxy_send_timeout 280s;
        proxy_read_timeout 280s;
    }

    # SPA fallback so client-side routes (e.g. /price-analytics) don't 404 on refresh.
    location / {
        try_files $uri /index.html;
    }
}
