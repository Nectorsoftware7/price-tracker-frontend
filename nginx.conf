server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # In docker-compose (local), "backend" resolves to the sibling container.
        # In standalone deployment (Render/Vercel), point this at the deployed
        # backend's public URL instead.
        proxy_pass https://price-tracker-backend-ioqo.onrender.com/api/;
        proxy_set_header Host price-tracker-backend-ioqo.onrender.com;
        proxy_ssl_server_name on;

        # A single "Check now" (Playwright-based scraping) plus a cold-start wake-up
        # on Render's free tier can comfortably exceed nginx's 60s default, returning
        # a 504 to the browser even though the backend finishes the check moments
        # later in the background. Give it more room.
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # SPA fallback so client-side routes (e.g. /price-analytics) don't 404 on refresh.
    location / {
        try_files $uri /index.html;
    }
}
