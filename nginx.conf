server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
    }

    # SPA fallback so client-side routes (e.g. /price-analytics) don't 404 on refresh.
    location / {
        try_files $uri /index.html;
    }
}
